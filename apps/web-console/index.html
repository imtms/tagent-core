<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f8f7" data-light="#f8f8f7" data-dark="#10100f" />
    <script>
      try {
        const saved = localStorage.getItem("tagent.theme");
        const theme = saved === "light" || saved === "dark" ? saved : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        const themeColor = document.querySelector('meta[name="theme-color"]');
        const nextThemeColor = theme === "dark" ? themeColor?.dataset.dark : themeColor?.dataset.light;
        if (nextThemeColor) themeColor.setAttribute("content", nextThemeColor);
      } catch {}
    </script>
    <style>
      :root {
        --boot-surface: oklch(0.998 0 0);
        --boot-muted: oklch(0.965 0 0);
        --boot-raised: oklch(0.998 0 0);
        --boot-line: oklch(0.18 0 0 / 10%);
        --boot-ink: oklch(0.18 0 0);
        --boot-copy: oklch(0.46 0 0);
        --boot-mark-bg: oklch(0.18 0 0);
        --boot-mark-fg: oklch(0.998 0 0);
      }
      :root[data-theme="dark"] {
        --boot-surface: oklch(0.18 0 0);
        --boot-muted: oklch(0.165 0 0);
        --boot-raised: oklch(0.18 0 0);
        --boot-line: oklch(1 0 0 / 10%);
        --boot-ink: oklch(0.94 0 0);
        --boot-copy: oklch(0.7 0 0);
        --boot-mark-bg: oklch(0.94 0 0);
        --boot-mark-fg: oklch(0.18 0 0);
      }
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: var(--boot-surface); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .boot-shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); width: 100%; height: 100dvh; overflow: hidden; color: var(--boot-ink); background: var(--boot-surface); }
      .boot-rail { padding: 8px; border-right: 1px solid var(--boot-line); background: var(--boot-muted); }
      .boot-brand { display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 8px; }
      .boot-mark { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--boot-mark-fg); background: var(--boot-mark-bg); }
      .boot-mark svg { display: block; }
      .boot-brand-copy { display: grid; }
      .boot-brand-copy strong { font: 600 20px/1 Cochin, Georgia, "Times New Roman", serif; letter-spacing: -.035em; }
      .boot-brand-copy span { display: none; }
      .boot-main { min-width: 0; background: var(--boot-surface); }
      .boot-topbar { height: 52px; padding: 0 16px; border-bottom: 1px solid var(--boot-line); display: flex; align-items: center; gap: 12px; }
      .boot-heading { display: flex; align-items: center; gap: 12px; }
      .boot-heading i, .boot-actions i { display: block; border-radius: 999px; background: var(--boot-line); }
      .boot-heading i:first-child { width: 78px; height: 8px; }
      .boot-heading i:last-child { width: 128px; height: 6px; opacity: .7; }
      .boot-actions { margin-left: auto; display: flex; gap: 6px; }
      .boot-actions i { width: 34px; height: 34px; border-radius: 9px; background: var(--boot-raised); border: 1px solid var(--boot-line); }
      @media (max-width: 980px) {
        .boot-shell { grid-template-columns: minmax(0, 1fr); }
        .boot-rail { display: none; }
        .boot-topbar { padding-inline: 12px; }
        .boot-topbar::before { width: 40px; height: 40px; flex: none; border: 1px solid var(--boot-line); border-radius: 9px; background: var(--boot-raised); content: ""; }
      }
    </style>
    <title>TAgent Core</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" role="status" aria-label="Loading TAgent Core">
        <aside class="boot-rail" aria-hidden="true">
          <div class="boot-brand">
            <span class="boot-mark">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M5 6.5h14M12 6.5V18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                <circle cx="5" cy="6.5" r="2" fill="currentColor" />
                <circle cx="19" cy="6.5" r="2" fill="currentColor" />
                <circle cx="12" cy="18" r="2" fill="currentColor" />
              </svg>
            </span>
            <span class="boot-brand-copy"><strong>TAgent</strong><span>Core runtime</span></span>
          </div>
        </aside>
        <main class="boot-main" aria-hidden="true">
          <header class="boot-topbar">
            <span class="boot-heading"><i></i><i></i></span>
            <span class="boot-actions"><i></i><i></i></span>
          </header>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
