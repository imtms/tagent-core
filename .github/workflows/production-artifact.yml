name: Production release artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-production-artifact:
    # GitHub's Ubuntu runner is Linux x64. setup-node pins the exact production
    # runtime/ABI; this runner also has the compiler toolchain needed when
    # better-sqlite3 cannot download a prebuilt binary.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - name: Upgrade npm to the supported major
        run: npm install --global npm@12
      - name: Verify production runtime target
        run: |
          test "$(node -p 'process.platform')" = linux
          test "$(node -p 'process.arch')" = x64
          test "$(node -p 'process.versions.node')" = 24.18.1
          test "$(node -p 'process.versions.modules')" = 137
          test "$(npm --version | cut -d. -f1)" -ge 12
      - name: Build and verify immutable production artifact
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: scripts/build-release.sh "$RUNNER_TEMP/tagent-core-${GITHUB_SHA}-linux-x64-node24-abi137.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: tagent-core-${{ github.sha }}-linux-x64-node24-abi137
          path: |
            ${{ runner.temp }}/tagent-core-${{ github.sha }}-linux-x64-node24-abi137.tar.gz
            ${{ runner.temp }}/tagent-core-${{ github.sha }}-linux-x64-node24-abi137.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
