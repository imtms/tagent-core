name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  postgres-memory-required:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: tagent_test
          POSTGRES_PASSWORD: tagent_test
          POSTGRES_DB: tagent_memory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tagent_test -d tagent_memory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - env:
          TAGENT_TEST_POSTGRES_URL: postgresql://tagent_test:tagent_test@127.0.0.1:5432/tagent_memory_test
        run: npx vitest run tests/postgres-memory.test.ts

  verify-and-release:
    needs: postgres-memory-required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test -- --run
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk -v version="$VERSION" '
            $0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 {flag=1; next}
            index($0, "## [") == 1 && flag {exit}
            flag
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "$RELEASE_TAG" --title "TAgent Core ${RELEASE_TAG}" --notes-file release-notes.md
