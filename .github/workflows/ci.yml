name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  postgres-memory-required:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: tagent_test
          POSTGRES_PASSWORD: tagent_test
          POSTGRES_DB: tagent_memory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tagent_test -d tagent_memory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: npm run build -w @tagent/memory
      - name: Required PostgreSQL 17, pgvector and pg_trgm integration
        env:
          TAGENT_TEST_POSTGRES_URL: postgresql://tagent_test:tagent_test@127.0.0.1:5432/tagent_memory_test
        run: npx vitest run tests/postgres-memory.test.ts
